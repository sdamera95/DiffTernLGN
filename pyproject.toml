[project]
name = "pst-dtlgn"
version = "0.1.0"
description = "Polynomial Surrogate Training for Differentiable Ternary Logic Gate Networks"
requires-python = ">=3.10"

# Core dependencies — these are backend-agnostic
dependencies = [
    "jax>=0.4.35",
    "jaxlib>=0.4.35",
    "equinox>=0.11.0",
    "optax>=0.2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# GPU support — install with: uv pip install -e ".[cuda]"
cuda = [
    "jax[cuda12]>=0.4.35",
]

# Visualization
viz = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

# Development / testing
dev = [
    "pytest>=7.0",
    "pytest-xdist",
    "ipykernel>=6.0",
    "nbclient>=0.11.0",
]

# D4RL/Minari trajectory data pipeline
data = [
    "minari[all]>=0.5.0",  # Updated to include all extras
    "h5py>=3.8",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "torchvision>=0.15",
]

# Everything for local Mac development
local = [
    "pst-dtlgn[viz,dev,data]",
]

# Everything for GPU workstation
gpu = [
    "pst-dtlgn[cuda,viz,dev,data]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
